name: diag-win (temporary)
on:
  push:
    branches: ['builder-win']
    paths: ['.github/workflows/diag-win.yml']
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   runner: ubuntu-22.04, exe: '' }
          - { name: windows, runner: windows-2022, exe: '.exe' }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Kit of the earlier run
        run: |
          T="$RUNNER_TEMP"; [ "$RUNNER_OS" = Windows ] && T="$(cygpath -u "$RUNNER_TEMP")"
          echo "T=$T" >> "$GITHUB_ENV"
          mkdir -p "$T/dl"; gh run download 41182193164 --repo "$GITHUB_REPOSITORY" -n kit-${{ matrix.name }} -D "$T/dl"
          S="$T/smoke test"; mkdir -p "$S/the kit"; tar -xzf "$T/dl/Infected-Vita-builder-${{ matrix.name }}.tar.gz" -C "$S/the kit"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Build infected-build from this tree
        run: |
          cd builder && go build -trimpath -ldflags='-s -w' -o "$T/smoke test/the kit/infected-build${{ matrix.exe }}" ./cmd/infected-build
      - name: Link with -save-temps and a map
        run: |
          S="$T/smoke test"; P="$S/the kit/infected-build${{ matrix.exe }}"
          rm -rf "$S/o"
          IB_DIAG_LINKARGS="-save-temps;;-Wl,-Map=$S/work dir/link.map;;-Wl,--trace-symbol=main" "$P" --gen .github/smoke/gen --work "$S/work dir" --out "$S/o" --jobs 2 --keep
          sha256sum "$S/work dir/eboot.bin"
          mkdir -p "$S/temps"; cd "$S/the kit"; ls | head -50; cp -v *.ltrans* *.wpa* *.ltrans.o* "$S/temps/" 2>/dev/null || true
          ls -l "$S/temps"
          cp "$S/work dir/link.map" "$S/temps/"
      - uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/smoke test/temps
            ${{ runner.temp }}/smoke test/work dir/*.elf
            ${{ runner.temp }}/smoke test/work dir/*.log
          retention-days: 1
