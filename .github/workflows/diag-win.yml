name: diag-win (temporary)
on:
  push:
    branches: ['builder-win']
    paths: ['.github/workflows/diag-win.yml']
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,     runner: ubuntu-22.04,   exe: '', gokey: linux }
          - { name: windows,   runner: windows-2022,   exe: '.exe', gokey: windows }
          - { name: mac-intel, runner: macos-15-intel, exe: '', gokey: mac }
          - { name: mac-arm,   runner: macos-14,       exe: '', gokey: mac }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Kit of the earlier run
        run: |
          T="$RUNNER_TEMP"; [ "$RUNNER_OS" = Windows ] && T="$(cygpath -u "$RUNNER_TEMP")"
          echo "T=$T" >> "$GITHUB_ENV"
          mkdir -p "$T/dl"; gh run download 41182193164 --repo "$GITHUB_REPOSITORY" -n kit-${{ matrix.name }} -D "$T/dl"
          S="$T/smoke test"; mkdir -p "$S/the kit"; tar -xzf "$T/dl/Infected-Vita-builder-${{ matrix.name }}.tar.gz" -C "$S/the kit"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Build infected-build from this tree, kit.json with vita-elf-create -s
        run: |
          S="$T/smoke test"
          (cd builder && go build -trimpath -ldflags='-s -w' -o "$S/the kit/infected-build${{ matrix.exe }}" ./cmd/infected-build)
          python3 -I - "$S/the kit/kit.json" <<'PY'
          import json, sys
          p = sys.argv[1]; r = json.load(open(p))
          r['elfCreate']['stripSections'] = True
          json.dump(r, open(p, 'w'), indent=1)
          print(r['elfCreate'])
          PY
      - name: infected-build --progress
        run: |
          S="$T/smoke test"; P="$S/the kit/infected-build${{ matrix.exe }}"
          rm -rf "$S/o"
          "$P" --progress --gen .github/smoke/gen --work "$S/work dir" --out "$S/o" --jobs 2 --keep | tee "$T/progress.txt" | head -60
          echo "EBOOT $(python3 -I -c 'import hashlib,sys,zipfile; print(hashlib.sha256(zipfile.ZipFile(sys.argv[1]).read("eboot.bin")).hexdigest())' "$S/o/infected.vpk")"
          cat "$S/work dir/build.log" | grep -c "partitions\|ltrans" || true
      - name: Kit in folders with odd characters
        run: |
          S="$T/smoke test"
          try() {
            K2="${B:-$S}/$1"; rm -rf "$K2" "$S/o2" "$S/w2"; mkdir -p "$K2"; cp -r "$S/the kit/." "$K2/"
            if "$K2/infected-build${{ matrix.exe }}" --gen .github/smoke/gen --out "$S/o2" --work "$S/w2" --keep --jobs 2 > "$S/try.log" 2>&1; then
              echo "OK   [$1] $(python3 -I -c 'import hashlib,sys,zipfile; print(hashlib.sha256(zipfile.ZipFile(sys.argv[1]).read("eboot.bin")).hexdigest()[:16])' "$S/o2/infected.vpk")"
            else
              echo "FAIL [$1]"; tail -3 "$S/try.log"; grep -v "^\$" "$S/w2/build.log" | tail -8 | cut -c1-400
            fi
          }
          try "Kit B (2)/kit"
          try "John Smith/kit"
          try "Kit & more/kit"
          try "John Smith's kit/kit"
          try $'Jos\xc3\xa9 \xc3\x85ngstr\xc3\xb6m/kit'
          try $'\xd0\x98\xd0\xb2\xd0\xb0\xd0\xbd/kit'
          try $'\xe6\x97\xa5\xe6\x9c\xac/kit'
          try "O'Brien (home) & Sons/kit"
          if [ "$RUNNER_OS" = Windows ]; then
            export B=/c/Users/Public/ibdiag
            try $'Jos\xc3\xa9 \xc3\x85ngstr\xc3\xb6m/kit'
            try $'\xd0\x98\xd0\xb2\xd0\xb0\xd0\xbd/kit'
            try $'\xe6\x97\xa5\xe6\x9c\xac/kit'
          fi
      - name: Kill the program while it compiles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $T = $env:RUNNER_TEMP; $S = Join-Path $T 'smoke test'; $kit = Join-Path $S 'the kit'; $exe = Join-Path $kit 'infected-build.exe'
          $gen = Join-Path $env:GITHUB_WORKSPACE '.github\smoke\gen'
          Remove-Item -Recurse -Force (Join-Path $S 'killwork') -ErrorAction SilentlyContinue
          $p = Start-Process -PassThru -FilePath $exe -ArgumentList @('--gen', "`"$gen`"", '--work', "`"$S\killwork`"", '--out', "`"$S\killout`"", '--jobs', '2') -RedirectStandardOutput (Join-Path $T 'kill.out') -RedirectStandardError (Join-Path $T 'kill.err')
          Start-Sleep -Milliseconds 2500
          $kitl = $kit.ToLower()
          function Kids { Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.ToLower().StartsWith($kitl) -and $_.ProcessId -ne $p.Id } }
          "before kill: $((Kids | ForEach-Object { $_.Name }) -join ' ')"
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 3
          $left = @(Kids)
          "after kill, processes of the kit left: $($left.Count) $((($left | ForEach-Object { $_.Name })) -join ' ')"
          if ($left.Count -gt 0) { $left | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }; exit 1 }
