name: diag-win (temporary)
on:
  push:
    branches: ['builder-win']
    paths: ['.github/workflows/diag-win.yml']
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   runner: ubuntu-22.04, exe: '' }
          - { name: windows, runner: windows-2022, exe: '.exe' }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Kit of the earlier run
        run: |
          T="$RUNNER_TEMP"; [ "$RUNNER_OS" = Windows ] && T="$(cygpath -u "$RUNNER_TEMP")"
          echo "T=$T" >> "$GITHUB_ENV"
          mkdir -p "$T/dl"; gh run download 41182193164 --repo "$GITHUB_REPOSITORY" -n kit-${{ matrix.name }} -D "$T/dl"
          S="$T/smoke test"; mkdir -p "$S/the kit"; tar -xzf "$T/dl/Infected-Vita-builder-${{ matrix.name }}.tar.gz" -C "$S/the kit"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Build infected-build from this tree
        run: |
          cd builder && go build -trimpath -ldflags='-s -w' -o "$T/smoke test/the kit/infected-build${{ matrix.exe }}" ./cmd/infected-build
      - name: Variants
        run: |
          S="$T/smoke test"; P="$S/the kit/infected-build${{ matrix.exe }}"
          one() { # name, work dir, extra env
            rm -rf "$S/o"; IB_DIAG_ENV="$3" "$P" --gen .github/smoke/gen --work "$2" --out "$S/o" --jobs 2 --keep > "$S/$1.log" 2>&1 || { cat "$S/$1.log"; echo "FAILED $1"; return; }
            printf '%-12s %s  elf %s\n' "$1" "$(sha256sum < "$2/eboot.bin" | cut -c1-16)" "$(sha256sum < "$2/infected.elf" | cut -c1-16)"
            ls -l "$2/obj/lean_000.o" | awk '{print "   lean_000.o", $5}'
          }
          one base "$S/work dir" ""
          mkdir -p "$S/another place (2)/deeper"
          one otherdir "$S/another place (2)/deeper/w ork" ""
          D="$(cd "$S" && pwd -W 2>/dev/null || pwd)"
          echo "drive/dir: $D"
          rm -rf "$S/save"; mkdir -p "$S/save"; cp "$S/work dir/obj/lean_000.o" "$S/save/"
      - uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/smoke test/work dir/obj
            ${{ runner.temp }}/smoke test/work dir/*.elf
            ${{ runner.temp }}/smoke test/work dir/*.velf
            ${{ runner.temp }}/smoke test/work dir/*.log
            ${{ runner.temp }}/smoke test/work dir/eboot.bin
          retention-days: 1
